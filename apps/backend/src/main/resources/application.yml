spring:
  application:
    name: blooking-backend

  # --- Datasource (PostgreSQL + pgvector) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blooking}
    username: ${DB_USER:blooking}
    password: ${DB_PASSWORD:blooking}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  # Schema is owned by Flyway, NOT Hibernate. ddl-auto stays "validate" so the
  # app fails fast if the entities drift from the migrated schema.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
    show-sql: false

  # Pageable defaults and stable Page JSON serialization (via_dto avoids the
  # unstable PageImpl structure and its startup warning).
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
        serialization-mode: via_dto

  # --- Flyway (database migrations) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # --- RabbitMQ (Spring AMQP) ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:blooking}
    password: ${RABBITMQ_PASSWORD:blooking}

  # --- Spring AI: Ollama embeddings ---
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      # Do not let the app block on a cold model download at startup;
      # the docker-compose "ollama-init" service pre-pulls the model.
      init:
        pull-model-strategy: never
      embedding:
        options:
          model: ${EMBEDDING_MODEL:bge-m3}

# --- Application-specific config ---
blooking:
  jwt:
    # HS256 signing secret. MUST be overridden via env var in real environments
    # and be at least 32 bytes (256 bits). The default is for local dev only.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-min-32-bytes!!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: blooking
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  recommendation:
    # Weights for building a user's preference embedding (weighted centroid of
    # the books they interacted with). Favorites are the strong signal; views a
    # weaker one, scaled by how many times a book was viewed, up to view-cap
    # (so repeated views mean stronger interest without refreshes dominating).
    favorite-weight: ${RECO_FAVORITE_WEIGHT:1.0}
    view-weight: ${RECO_VIEW_WEIGHT:0.25}
    view-cap: ${RECO_VIEW_CAP:3}

# --- Server ---
server:
  port: ${SERVER_PORT:8080}

# --- Actuator (operational endpoints) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: blooking-backend
    description: Core REST API for book search and recommendation

logging:
  level:
    root: INFO
    dev.blooking: DEBUG
