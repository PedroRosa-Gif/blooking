<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blooking — discover books under a night sky, with hybrid search and personalized recommendations." />
    <meta name="theme-color" content="#060d16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Blooking</title>
    <!-- Set the theme before paint to avoid a flash of the wrong theme.
         Dark is the default; a stored choice or OS light preference can override. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('blooking.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
